<html lang="en">
<head>

<title>Crate Pushers</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #1c1830; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f6f0e6; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 3px #000a; }
  #lvl { top: max(12px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); font-weight: 800; font-size: 19px; line-height: 1.2; max-width: calc(100vw - 170px); }
  #lvl small { display: block; font-size: 13px; font-weight: 600; opacity: .8; font-variant-numeric: tabular-nums; }
  #tools { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); display: flex; gap: 8px; }
  #tools button { min-width: 64px; height: 44px; padding: 0 10px; border-radius: 12px; border: 1px solid #ffffff33; background: #2c2547e6; color: #fff; font: 700 14px system-ui, sans-serif; cursor: pointer; touch-action: none; }
  #tools button.on { background: #ffb347; color: #2a1600; border-color: #ffb347; }
  #vote { top: calc(max(12px, env(safe-area-inset-top)) + 54px); left: 50%; transform: translateX(-50%); padding: 7px 14px; border-radius: 12px; background: #ffb347; color: #2a1600;
          font-weight: 800; font-size: 14px; text-shadow: none; white-space: nowrap; box-shadow: 0 4px 14px #0007; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
  #vote:empty { display: none; }
  #hint { bottom: calc(max(10px, env(safe-area-inset-bottom)) + 24px); left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); text-align: center; font-size: 15px; font-weight: 600; color: #ffd98a; }
  #net { bottom: max(8px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); font-size: 12px; opacity: .75; white-space: nowrap; }
  #msg { top: 34%; left: 0; right: 0; text-align: center; font-size: 34px; font-weight: 900; color: #ffd23f; transition: opacity .35s, transform .35s; opacity: 0; transform: scale(.8); }
  #msg.on { opacity: 1; transform: scale(1); }

  #over[hidden], #pad[hidden], #tools[hidden] { display: none; }
  .card { width: min(380px, calc(100vw - 32px)); max-height: 86vh; overflow: auto; padding: 22px; border-radius: 16px; background: #2a2346; border: 1px solid #ffffff22; text-align: center; box-sizing: border-box; }
  .card h2 { margin: 0 0 4px; font-size: 26px; color: #ffd23f; }
  .card h3 { margin: 14px 0 4px; font-size: 14px; color: #ffb347; text-align: left; }
  .card ol { text-align: left; margin: 0; padding-left: 24px; font-size: 14px; } .card li span { float: right; font-variant-numeric: tabular-nums; } .card li.note { list-style: none; margin-left: -24px; opacity: .8; }
  button.go { width: 100%; min-height: 48px; margin-top: 14px; border: 0; border-radius: 12px; background: #52d273; color: #07210f; font: 800 17px system-ui, sans-serif; cursor: pointer; }
  #pad { position: fixed; left: max(14px, env(safe-area-inset-left)); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 18px); width: 174px; height: 174px; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 3px; }
  #pad button { border-radius: 14px; border: 2px solid #ffffff55; background: #ffffff1c; color: #fff; font: 800 20px system-ui, sans-serif; touch-action: none; padding: 0; }
  #pad button.on { background: #ffffff55; }
  #pad [data-d="0"] { grid-area: 1 / 2; } #pad [data-d="3"] { grid-area: 2 / 1; } #pad [data-d="1"] { grid-area: 2 / 3; } #pad [data-d="2"] { grid-area: 3 / 2; }
  @media (orientation: portrait) { .touch #hint { bottom: auto; top: calc(max(12px, env(safe-area-inset-top)) + 100px); } }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="lvl"></div>
<div id="tools"><button id="undo" title="Undo the last push (Z)">↶ Undo</button><button id="reset" title="Start the level again (R)">⟲ Reset</button></div>
<div class="hud" id="vote"></div>
<div class="hud" id="hint"></div>
<div class="hud" id="msg"></div>
<div class="hud" id="net">Connecting…</div>
<div id="pad" hidden><button data-d="0">▲</button><button data-d="3">◀</button><button data-d="1">▶</button><button data-d="2">▼</button></div>
<div id="over" hidden><div class="card">
  <h2>Warehouse cleared!</h2>
  <div id="doneTime"></div>
  <h3>Fastest crews</h3><ol id="board"><li class="note">Loading…</li></ol>
  <button class="go" id="again">Play again</button>
</div></div>
<script>
/* ═══ CRATE PUSHERS · a Multiplayer Agent starter ═══════════════════════════════════════
 * Push every crate onto its pad, together. Co-op, 1–4 players; bot buddies fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ speeds, timers, votes, and the LEVELS drawn as text maps (legend inside)
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   LEVELS ........ reads the text maps: walls, floor, pads, crates, spawns
 *   RUN (HOST) .... pushes, steel crates needing two, undo/reset votes, level clear, next level
 *   PLANNER ....... finds a way to push one crate onto a pad (the bots use it)
 *   BOTS .......... the buddies: push wood crates, back you up on steel ones, ask for a hand
 *   ME ............ walking on the grid and leaning on crates. Each player writes only its own.
 *   DRAW .......... floor, walls, pads, crates sliding, players, sparkles
 *   HUD & DONE .... level name, timer, vote banner, the final card, leaderboard
 *   INPUT ......... keyboard, D-pad buttons, drag to walk
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (one JSON field: grid cell, facing, level key)
 *     whenever it steps, `hb` (heartbeat) once a second, `n`/`c` (name, color) once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host moves crates. It writes ONE shared field `game`
 *     (id, version `v`, level, try, phase, every crate's cell, the open vote, timers) when
 *     something changes, `hist` (the undo steps) and `bots`. A new host adopts all of it.
 *   - Intents to the host: "push" {i, x, y, d, px, py} (I lean on crate i from cell px,py),
 *     "vote" {k: "undo"|"reset"}, "again" {}. Walking into an empty cell needs no one's OK.
 *     A crate moves when enough players stand in one line behind it, all pushing that way
 *     within CONFIG.pushWindow ms: one for wood, two for steel. Each pusher sees the crate
 *     move and steps forward itself.
 *   - Undo puts every crate back one push and sends players to where they stood (`back`).
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "fastest-run": all levels from the start, stored as 3600000 - ms
 *     (boards keep the highest score), shown on the final card.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 2,             // bots fill the room up to this many players: alone, you get one buddy
  stepMs: 135,          // ms to walk one tile
  botStepMs: 300,       // a bot's ms per tile (slower than you)
  botThinkMs: [700, 1600], // a bot's pause before it starts on a crate (min, max)
  botStartMs: 2500,     // bots look around this long when a level starts
  leaveForYou: 20000,   // bots leave one wood crate per player, unless no player has pushed for this long (ms)
  pushWindow: 650,      // ms: pushes this close together count as "at the same time"
  pushWaitMs: 650,      // ms you lean on a crate waiting for it to move
  pushRepeatMs: 180,    // ms between push intents while you hold a direction into a crate
  voteMs: 10000,        // how long an undo/reset vote stays open
  history: 12,          // undo steps kept
  clearFor: 2800,       // ms the "level clear" moment lasts
  doneFor: 30000,       // ms the final card shows before a new run starts
  board: "fastest-run",
  // Map legend: # wall · . floor · s spawn (4 per level) · (space) outside
  //   c wood crate  → o wood pad      h steel crate (needs two pushers in a line) → O steel pad
  levels: [
    { name: "Warm-up", hint: "Walk into a crate to push it. Get every crate onto a glowing pad.", map: [
      "############",
      "#..........#",
      "#s..c....o.#",
      "#s.........#",
      "#s..c....o.#",
      "#s.........#",
      "############"] },
    { name: "Steel needs two", hint: "Steel crates need two pushers: line up behind it and push together.", map: [
      "#############",
      "#...........#",
      "#s..h....O..#",
      "#s..........#",
      "#######.....#",
      "#s..c.....o.#",
      "#s..........#",
      "#############"] },
    { name: "Round the corner", hint: "Push a crate into a corner and it's stuck there. Vote Undo if that happens.", map: [
      "#############",
      "#s...#......#",
      "#s.c.#.c..o.#",
      "#....#......#",
      "#..c........#",
      "#s......##o.#",
      "#s...o..##..#",
      "#############"] },
    { name: "Two by two", hint: "Two steel crates, two wood ones. Split up, then team up.", map: [
      "##############",
      "#s..........s#",
      "#............#",
      "#...h....h...#",
      "#..c......c..#",
      "#............#",
      "#...O....O...#",
      "#s.o......o.s#",
      "##############"] },
    { name: "Big order", hint: "Fill the back of the bay first, or the second steel crate won't fit.", map: [
      "#############",
      "#s.........s#",
      "#...........#",
      "#..h.....h..#",
      "#...........#",
      "#.c.#...#.c.#",
      "#...#.O.#...#",
      "#o..#.O.#..o#",
      "#s..#...#..s#",
      "#############"] },
  ],
};
const BOT_NAMES = ["Buddy", "Forklift", "Dolly", "Hauler"];
const COLORS = ["#ff5d73", "#4dabff", "#ffd23f", "#52d273", "#c77dff", "#ff8c42"];
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0]; // directions: 0 up, 1 right, 2 down, 3 left

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'crate-pushers',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never mutate what this returns). */
function shared(key, fallback) {
  const raw = S.shared[key], m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = parse(raw, fallback); memo.set(key, { raw, v }); return v;
}
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map(); // sessionId -> { hb, at } on OUR clock
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let hostHold = 0, lastTick = performance.now(); // lastTick: when frame() last ran; hostHold: after a freeze, no hosting before this time (see frame())
const isHost = () => performance.now() > hostHold && performance.now() - lastTick < 1000 && livePlayers()[0] === net.sessionId; // a tab whose loop has stopped doesn't host
const humanIds = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId));

// ── LEVELS ──────────────────────────────────────────────────────────────────────────
/** A text map as lists: floor cells, pads, crates (with `heavy` for steel), spawns. */
function readLevel(def) {
  const cols = Math.max(...def.map.map((r) => r.length)), rows = def.map.length;
  const L = { name: def.name, hint: def.hint, cols, rows, floor: [], wall: [], pads: [], crates: [], spawns: [] };
  def.map.forEach((row, y) => [...row.padEnd(cols)].forEach((ch, x) => {
    L.wall[y * cols + x] = ch === "#";
    L.floor[y * cols + x] = ch !== "#" && ch !== " ";
    if (ch === "o" || ch === "O") L.pads.push({ x, y, heavy: ch === "O" });
    if (ch === "c" || ch === "h") L.crates.push({ x, y, heavy: ch === "h" });
    if (ch === "s") L.spawns.push({ x, y });
  }));
  return L;
}
const LEVELS = CONFIG.levels.map(readLevel);
const isFloor = (L, x, y) => x >= 0 && y >= 0 && x < L.cols && y < L.rows && L.floor[y * L.cols + x];
const isWall = (L, x, y) => x >= 0 && y >= 0 && x < L.cols && y < L.rows && L.wall[y * L.cols + x];
const crateAt = (g, x, y) => g.cr.findIndex((c) => c[0] === x && c[1] === y);
/** Is crate i resting on a pad of its own kind? */
const onPad = (L, g, i) => L.pads.some((p) => p.heavy === L.crates[i].heavy && p.x === g.cr[i][0] && p.y === g.cr[i][1]);
const solved = (L, g) => L.pads.every((p) => g.cr.some((c, i) => c[0] === p.x && c[1] === p.y && L.crates[i].heavy === p.heavy));

// ── RUN (HOST) ──────────────────────────────────────────────────────────────────────
const host = { bots: new Map(), wasHost: false, last: null, key: "", lastBots: 0, botsJson: "", pushes: new Map(), touched: new Map(), hist: [], lastMoveAt: 0, lastSync: 0 };
/** The run as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */
function game() {
  const g = shared("game", null);
  return host.last && isHost() && (!g || host.last.v > g.v) ? host.last : g;
}
function writeGame(g) { g = { ...g, v: (game()?.v ?? 0) + 1 }; host.last = g; net.setShared("game", JSON.stringify(g)); return g; }
const keyOf = (g) => `r${g.id}l${g.lv}t${g.tr}`;
const startCrates = (lv) => LEVELS[lv].crates.map((c) => [c.x, c.y]);
function startLevel(g, lv, tr) {
  host.hist = []; writeHist(`r${g.id}l${lv}t${tr}`);
  host.lastMoveAt = host.humanAt = performance.now();
  return writeGame({ ...g, lv, tr, phase: "play", at: Date.now(), endsAt: 0, cr: startCrates(lv), mv: 0, vote: null, un: 0, back: null });
}
const newRun = (id) => startLevel({ id, runAt: Date.now(), times: [] }, ATTRACT ? 3 : 0, 0);
const nextLevel = (lv) => (ATTRACT ? (lv === 3 ? 1 : 3) : lv + 1); // the preview loops the two busiest levels
function writeHist(key) {
  let list = host.hist.slice(-CONFIG.history), json = JSON.stringify({ k: key, list });
  while (json.length > 1900 && list.length) { list = list.slice(1); json = JSON.stringify({ k: key, list }); }
  host.hist = list; net.setShared("hist", json);
}

/** A "push" intent: player `from` leans on crate i from cell (px, py), direction d. */
function applyPush(from, m) {
  const g = game(); if (!g || g.phase !== "play" || !m) return false;
  const i = m.i | 0, d = m.d | 0, c = g.cr[i];
  if (!c || c[0] !== m.x || c[1] !== m.y || d < 0 || d > 3) return false;
  const k = Math.abs(m.px - m.x) + Math.abs(m.py - m.y); // how far back in the line the pusher stands
  if (k < 1 || k > 4 || m.px !== m.x - DX[d] * k || m.py !== m.y - DY[d] * k) return false;
  const now = performance.now();
  host.pushes.set(from, { i, d, x: m.px, y: m.py, at: now });
  if (!host.bots.has(from)) { host.touched.set(i, now); host.humanAt = now; }
  return tryMove(g, i, d, now);
}
/** Move crate i one tile in direction d if enough of the line behind it is pushing that way and the tile ahead is free. */
function tryMove(g, i, d, now) {
  const L = LEVELS[g.lv], [x, y] = g.cr[i], line = [];
  for (let k = 1; k <= 4; k++) { // everyone standing in one unbroken line behind the crate, all pushing
    const cx = x - DX[d] * k, cy = y - DY[d] * k;
    const hit = [...host.pushes].find(([, p]) => !p.used && p.i === i && p.d === d && p.x === cx && p.y === cy && now - p.at < CONFIG.pushWindow);
    if (!hit) break;
    line.push(hit[0]);
  }
  if (line.length < (L.crates[i].heavy ? 2 : 1)) return false;
  const ax = x + DX[d], ay = y + DY[d], all = bodies(g);
  if (!isFloor(L, ax, ay) || crateAt(g, ax, ay) >= 0 || all.some((b) => b.x === ax && b.y === ay)) return false;
  host.hist.push({ c: g.cr, p: Object.fromEntries(all.map((b) => [b.id, [b.x, b.y]])) }); // undo step
  const cr = g.cr.map((c) => c.slice()); cr[i] = [ax, ay];
  for (const id of line) { // the line steps forward: bots here, players on their own screens
    const p = host.pushes.get(id); p.x += DX[d]; p.y += DY[d]; p.used = true; // still "leaning", so a helper stays put
    const b = host.bots.get(id); if (b) stepBot(b, d, now);
  }
  writeGame({ ...g, cr, mv: (g.mv || 0) + 1 });
  writeHist(keyOf(g));
  host.lastMoveAt = now;
  return true;
}
/** A "vote" intent: start or join an undo/reset vote. It passes once more than half the players agree. */
function applyVote(from, m) {
  const g = game(); if (!g || g.phase !== "play" || !m || (m.k !== "undo" && m.k !== "reset")) return;
  if (m.k === "undo" && !host.hist.length) return;
  const now = Date.now(), open = g.vote && g.vote.k === m.k && g.vote.endsAt > now;
  const v = open ? g.vote : { k: m.k, yes: [], endsAt: now + CONFIG.voteMs, by: nameOf(from) };
  checkVote(writeGame({ ...g, vote: { ...v, yes: [...new Set([...v.yes, from])] } }));
}
const votesNeeded = () => Math.floor(humanIds().length / 2) + 1;
function checkVote(g) {
  const v = g.vote; if (!v) return;
  const humans = humanIds(), yes = v.yes.filter((id) => humans.includes(id)).length;
  if (yes >= votesNeeded()) { if (v.k === "undo") doUndo(g); else startLevel(g, g.lv, g.tr + 1); net.send("fx", { s: v.k }); fx(v.k); }
  else if (Date.now() > v.endsAt) writeGame({ ...g, vote: null });
}
/** Put every crate back one push; bots go back themselves, players read `back` and step back. */
function doUndo(g) {
  const step = host.hist.pop(); if (!step) return writeGame({ ...g, vote: null });
  for (const b of host.bots.values()) { const p = step.p[b.id]; if (p) placeBot(b, p[0], p[1]); }
  writeGame({ ...g, cr: step.c, vote: null, un: (g.un || 0) + 1, back: step.p, mv: Math.max(0, (g.mv || 0) - 1) });
  writeHist(keyOf(g));
}
function hostTick(dt, now) {
  if (!host.wasHost) adopt();
  let g = game();
  if (!g) g = newRun(1);
  let L = LEVELS[g.lv];
  const t = Date.now();
  if (host.key !== keyOf(g)) resetBots(g, L, now);
  if (now - host.lastSync > 1000) { host.lastSync = now; syncBots(g, L, now); }
  if (g.phase === "play") {
    if (g.vote) { checkVote(g); g = game(); }
    if (g.phase === "play" && solved(L, g)) g = writeGame({ ...g, phase: "clear", endsAt: t + CONFIG.clearFor, vote: null, times: [...(g.times || []), t - g.at] });
    else if (ATTRACT && now - host.lastMoveAt > 12000) g = startLevel(g, g.lv, g.tr + 1); // the preview never sits stuck
  } else if (g.phase === "clear" && t > g.endsAt) {
    const n = nextLevel(g.lv);
    g = n < LEVELS.length ? startLevel(g, n, 0) : writeGame({ ...g, phase: "done", endsAt: t + CONFIG.doneFor, total: t - g.runAt });
  } else if (g.phase === "done" && t > g.endsAt) g = newRun(g.id + 1);
  if (host.key !== keyOf(g)) { L = LEVELS[g.lv]; resetBots(g, L, now); } // a level (re)started just now: bots drop jobs from the old one
  for (const [id, p] of host.pushes) if (now - p.at > 3000) host.pushes.delete(id);
  const all = bodies(g);
  assignHelpers(g, L, all, now);
  for (const b of host.bots.values()) botTick(b, now, g, L, all);
  if (now - host.lastBots > 100) {
    host.lastBots = now;
    const json = JSON.stringify({ k: host.key, list: botList(host.key) });
    if (json !== host.botsJson) { host.botsJson = json; net.setShared("bots", json); }
  }
}
/** Become host: take the undo steps and the bots exactly as state has them. */
function adopt() {
  host.wasHost = true; host.bots.clear(); host.pushes.clear();
  const g = game(), hist = shared("hist", { k: "", list: [] });

  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = takenColors();
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { seats: 3, botStepMs: 125, botThinkMs: [80, 220], clearFor: 1600 });
  requestAnimationFrame(frame);
})();
</script>
